{{- $proxy := .Values.impersonationProxy -}}
apiVersion: config.concierge.pinniped.dev/v1alpha1
kind: CredentialIssuer
metadata:
  name: {{ include "common.names.fullname" . }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: concierge
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  impersonationProxy:
    mode: {{ $proxy.mode }}
    {{- with (coalesce $proxy.externalEndpoint (ternary .Values.tlsRoute.hostname "" .Values.tlsRoute.enabled)) }}
    externalEndpoint: {{ tpl . $ | quote }}
    {{- end }}
    service:
    {{- if .Values.tlsRoute.enabled }}
      # exposed through the chart's proxy Service + TLSRoute instead
      type: None
    {{- else }}
      {{- toYaml $proxy.service | nindent 6 }}
    {{- end }}
    {{- with $proxy.tls }}
    tls: {{- toYaml . | nindent 6 }}
    {{- end }}
