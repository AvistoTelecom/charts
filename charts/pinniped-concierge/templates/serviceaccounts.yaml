{{- range $sa := list (dict "name" (include "common.names.fullname" .) "automount" true) (dict "name" (include "pinniped-concierge.agentServiceAccountName" .) "automount" false) (dict "name" (include "pinniped-concierge.impersonationServiceAccountName" .) "automount" false) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ include "common.names.namespace" $ | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $.Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: concierge
  {{- if $.Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $.Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $sa.automount }}
{{- end }}
